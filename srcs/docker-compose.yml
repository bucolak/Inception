services:
    mariadb:
        build: ./requirements/mariadb
        image: mariadb:1.0
        container_name: mariadb
        env_file: .env
        volumes:
            - mariadb-data:/var/lib/mysql
        networks:
            - inception
        restart: unless-stopped

    wordpress:
        build: ./requirements/wordpress
        image: wordpress:1.0
        container_name: wordpress
        env_file: .env
        depends_on:
            - mariadb
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        restart: unless-stopped

    nginx:
        build: ./requirements/nginx
        image: nginx:1.0
        container_name: nginx
        depends_on:
            - wordpress
        ports:
            - "443:443"
        volumes:
            - wordpress_data:/var/www/html
        networks:
            - inception
        restart: unless-stopped

volumes:
    mariadb-data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/bucolak/data/mariadb
    wordpress_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: /home/bucolak/data/wordpress

networks:
    inception:
        driver: bridge